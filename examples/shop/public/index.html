<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shop example</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header>
    <h1>Shop example</h1>
    <p>Static files published by deploy.sh. The sample host is shop.example.com.</p>

</body>
</html>
